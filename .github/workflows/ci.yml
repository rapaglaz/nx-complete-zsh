# Lint, unit tests with the current zsh, and the Oh My Zsh smoke test.
# Actions are pinned to a commit SHA; the comment names the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.18
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: mise run check

  test:
    strategy:
      fail-fast: false
      matrix:
        # zsh from the system: the current release on both platforms. The oldest supported
        # release is tested by the Release workflow, before the GitHub Release is created.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.18
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: mise run test

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.18
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      # The runner image makes /usr/share/zsh writable for everyone, so compaudit in Oh My Zsh
      # refuses the system completion functions.
      - if: runner.os == 'Linux'
        run: sudo chmod -R go-w /usr/share/zsh
      - run: mise run smoke
